name: Build NOISE MU6IX WRECKAGE (Windows & macOS VST3)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows-vst3:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "Building NOISE MU6IX WRECKAGE v$v (Windows x64)"

      - name: Clone Steinberg VST3 SDK & Xiph libFLAC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path third_party | Out-Null
          git clone --depth 1 https://github.com/steinbergmedia/vst3sdk.git third_party/vst3sdk
          git -C third_party/vst3sdk submodule update --init --depth 1 base pluginterfaces public.sdk cmake
          git clone --depth 1 --branch 1.4.3 https://github.com/xiph/flac.git third_party/flac

      - name: Configure CMake (Windows x64)
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          cmake -B build -A x64

      - name: Build WRECKAGE.vst3 (Windows x64)
        shell: pwsh
        run: |
          cmake --build build --config Release --target WRECKAGE --parallel

      - name: Package Windows Release ZIP
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $dist = "dist/NOISE_MU6IX_WRECKAGE_v${ver}_Windows"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $fullVst = (Get-ChildItem -Path build -Recurse -Directory -Filter "WRECKAGE.vst3" | Select-Object -First 1).FullName
          Copy-Item -Recurse -Force "$fullVst" "$dist/WRECKAGE.vst3"
          Copy-Item "VERSION" "$dist/VERSION.txt"
          Compress-Archive -Path "$dist/*" -DestinationPath "NOISE_MU6IX_WRECKAGE_v${ver}_Windows_x64.zip" -Force

      - name: Upload Windows VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOISE_MU6IX_WRECKAGE_v${{ steps.ver.outputs.version }}_Windows_x64
          path: NOISE_MU6IX_WRECKAGE_v${{ steps.ver.outputs.version }}_Windows_x64.zip

  build-macos-vst3:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Version
        id: ver
        run: |
          set -euo pipefail
          v=$(tr -d '\r\n' < VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building NOISE MU6IX WRECKAGE v$v (macOS Universal arm64 + x86_64)"

      - name: Clone Steinberg VST3 SDK & Xiph libFLAC
        run: |
          set -euo pipefail
          mkdir -p third_party
          git clone --depth 1 https://github.com/steinbergmedia/vst3sdk.git third_party/vst3sdk
          git -C third_party/vst3sdk submodule update --init --depth 1 base pluginterfaces public.sdk cmake
          git clone --depth 1 --branch 1.4.3 https://github.com/xiph/flac.git third_party/flac

      - name: Build Apple Silicon (arm64)
        run: |
          set -euo pipefail
          cmake -B build_arm64 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DSMTG_ADD_VST3_UTILITIES=ON \
            -DSMTG_CREATE_MODULE_INFO=ON
          cmake --build build_arm64 --config Release --target WRECKAGE --parallel

      - name: Build Intel (x86_64)
        run: |
          set -euo pipefail
          cmake -B build_x86_64 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DSMTG_ADD_VST3_UTILITIES=OFF \
            -DSMTG_CREATE_MODULE_INFO=OFF
          cmake --build build_x86_64 --config Release --target WRECKAGE --parallel

      - name: Create Universal Binary & Package macOS ZIP
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.version }}"
          ARM_VST=$(find build_arm64 -type d -name "WRECKAGE.vst3" | head -n 1)
          X64_VST=$(find build_x86_64 -type d -name "WRECKAGE.vst3" | head -n 1)
          test -n "$ARM_VST"
          test -n "$X64_VST"
          DIST="dist/NOISE_MU6IX_WRECKAGE_v${ver}_macOS"
          mkdir -p "$DIST"
          cp -R "$ARM_VST" "$DIST/WRECKAGE.vst3"
          lipo -create \
            "$ARM_VST/Contents/MacOS/WRECKAGE" \
            "$X64_VST/Contents/MacOS/WRECKAGE" \
            -output "$DIST/WRECKAGE.vst3/Contents/MacOS/WRECKAGE"
          lipo -info "$DIST/WRECKAGE.vst3/Contents/MacOS/WRECKAGE"
          codesign --force --deep --sign - "$DIST/WRECKAGE.vst3"
          cp VERSION "$DIST/VERSION.txt"
          (cd "$DIST" && zip -r -y "../../NOISE_MU6IX_WRECKAGE_v${ver}_macOS_Universal.zip" WRECKAGE.vst3 VERSION.txt)

      - name: Upload macOS VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOISE_MU6IX_WRECKAGE_v${{ steps.ver.outputs.version }}_macOS_Universal
          path: NOISE_MU6IX_WRECKAGE_v${{ steps.ver.outputs.version }}_macOS_Universal.zip
          
