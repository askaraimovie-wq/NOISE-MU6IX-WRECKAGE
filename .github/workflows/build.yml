name: Build NOISE MU6IX WRECKAGE (Windows VST3)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows-vst3:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "Building NOISE MU6IX — WRECKAGE v$v"

      - name: Clone Steinberg VST3 SDK & Xiph libFLAC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path third_party | Out-Null
          git clone --depth 1 https://github.com/steinbergmedia/vst3sdk.git third_party/vst3sdk
          git -C third_party/vst3sdk submodule update --init --depth 1 base pluginterfaces public.sdk cmake
          git clone --depth 1 --branch 1.4.3 https://github.com/xiph/flac.git third_party/flac

      - name: Configure CMake (Windows x64)
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          cmake -B build -A x64

      - name: Build WRECKAGE.vst3
        shell: pwsh
        run: |
          cmake --build build --config Release --target WRECKAGE --parallel

      - name: Package WRECKAGE Release ZIP
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $dist = "dist/NOISE_MU6IX_WRECKAGE_v$ver"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $fullVst = (Get-ChildItem -Path build -Recurse -Directory -Filter "WRECKAGE.vst3" | Select-Object -First 1).FullName
          Copy-Item -Recurse -Force "$fullVst" "$dist/WRECKAGE.vst3"
          Copy-Item "VERSION" "$dist/VERSION.txt"
          Compress-Archive -Path "$dist/*" -DestinationPath "NOISE_MU6IX_WRECKAGE_v${ver}_Windows_x64.zip" -Force

      - name: Upload Windows VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOISE_MU6IX_WRECKAGE_v${{ steps.ver.outputs.version }}_Windows_x64
          path: NOISE_MU6IX_WRECKAGE_v${{ steps.ver.outputs.version }}_Windows_x64.zip
          
